version: '3.8'
services:
  ipfs:
    build: .
    restart: unless-stopped
    volumes:
      - 'ipfs_path:/data/ipfs'
      - 'ipfs_fuse:/ipfs'
      - 'ipns_fuse:/ipns'
    environment:
      - IPFS_PATH=/data/ipfs
    ports:
      - '4001:4001/tcp'
      - '4001:4001/udp'
      - '127.0.0.1:5001:5001'
volumes:
  ipfs_path: null
  ipfs_fuse: null
  ipns_fuse: null
